<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="todo-container">

        <header>
            <h1>📝 My To-Do List</h1>
            <p>Manage your tasks efficiently</p>
        </header>

        <!-- Add Task -->
        <section class="task-input">
            <label for="taskInput" class="sr-only">Enter a task</label>

            <input type="text" id="taskInput" placeholder="Enter a new task..." autocomplete="off">

            <button id="addTaskBtn">Add Task</button>
        </section>

        <!-- Filters -->
        <nav class="filters" aria-label="Task filters">

            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="active">
                Active
            </button>

            <button class="filter-btn" data-filter="completed">
                Completed
            </button>

        </nav>

        <!-- Task List -->
        <section>
            <ul id="taskList" class="task-list">
                <!-- Tasks are created dynamically using JavaScript -->
            </ul>

            <p id="emptyMessage" class="empty-message">
                No tasks yet. Add your first task!
            </p>
        </section>

        <!-- Task Count -->
        <footer class="task-footer">
            <span id="taskCount">0 tasks</span>

            <button id="clearCompleted">
                Clear Completed
            </button>
        </footer>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
